name: Alchemy quality gates

on:
  push:
    branches:
      - design/phase-1
      - build/phase-2-planner
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alchemy-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun run lint
      - name: Supabase migration safety checks
        run: bun run check:supabase
      - name: Privacy regression tests
        run: bun run test
      - name: Production build
        run: bun run build
